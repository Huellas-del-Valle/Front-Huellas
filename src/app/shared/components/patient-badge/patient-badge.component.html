<div
  class="inline-flex flex-wrap items-center gap-2.5 rounded-xl border px-3 py-1.5 transition-all"
  [ngClass]="speciesConfig().badgeClasses"
  data-testid="patient-badge">
  
  <!-- Identificador Único Inmutable (Anti-homonimia RNF-04) -->
  <span
    class="rounded-lg px-2 py-0.5 font-mono text-xs font-bold tracking-wider shadow-xs"
    [ngClass]="speciesConfig().codeClasses"
    data-testid="patient-unique-code">
    {{ uniqueCode() }}
  </span>

  <!-- Especie + Nombre -->
  <div class="flex items-center gap-1.5">
    <span class="text-base leading-none" aria-hidden="true">{{ speciesConfig().emoji }}</span>
    <span class="text-sm font-bold tracking-tight" data-testid="patient-name">{{ name() }}</span>
    <span class="text-xs font-medium opacity-80">({{ speciesConfig().label }})</span>
  </div>

  <!-- Información extendida (solo cuando no es compacto) -->
  @if (!compact()) {
    @if (breed()) {
      <span class="hidden sm:inline text-xs opacity-75">• {{ breed() }}</span>
    }
    @if (ownerName()) {
      <span class="text-xs font-medium opacity-85 border-l border-current/20 pl-2" data-testid="patient-owner">
        Tutor: {{ ownerName() }}
      </span>
    }
  }
</div>
