<!-- Componente transversal PatientBadge (Anti-Homonimia RNF-04) -->
@if (pillOnly()) {
  <!-- Píldora compacta estilo Figma para columna ID Mascota -->
  <span
    class="inline-flex items-center gap-1.5 rounded-lg border px-2.5 py-1 font-mono text-xs font-bold tracking-wide"
    [ngClass]="speciesConfig().pillClasses"
    data-testid="patient-unique-code">
    <svg class="w-3.5 h-3.5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z" />
    </svg>
    {{ uniqueCode() }}
  </span>
} @else {
  <!-- Badge Completo para Cabeceras Clínicas, Formularios y Perfiles -->
  <div
    class="inline-flex flex-wrap items-center gap-2.5 rounded-xl border px-3 py-1.5 transition-all"
    [ngClass]="speciesConfig().badgeClasses"
    data-testid="patient-badge">
    
    <!-- Píldora de Código Único (Estilo Figma) -->
    <span
      class="inline-flex items-center gap-1.5 rounded-lg border border-[#bbf7d0] bg-[#e8f5ee] px-2.5 py-0.5 font-mono text-xs font-bold tracking-wider text-[#0b6b4d]"
      data-testid="patient-unique-code">
      <svg class="w-3.5 h-3.5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z" />
      </svg>
      {{ uniqueCode() }}
    </span>

    <!-- Icono SVG Especie + Nombre -->
    <div class="flex items-center gap-1.5">
      @if (species() === 'CANINO') {
        <!-- Huella Canina SVG -->
        <svg class="w-4 h-4 text-sky-700 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
          <circle cx="11" cy="4" r="2"/><circle cx="18" cy="8" r="2"/><circle cx="20" cy="16" r="2"/>
          <path d="M9 10a5 5 0 0 1 5 5v3.5a3.5 3.5 0 0 1-6.84 1.045Q6.52 17.48 4.46 16.84A3.5 3.5 0 0 1 5.5 10Z"/>
        </svg>
      } @else if (species() === 'FELINO') {
        <!-- Silueta / Bigotes Felino SVG -->
        <svg class="w-4 h-4 text-amber-700 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 5c.67 0 1.35.09 2 .26 1.78-2 5.03-2.84 6.42-2.26 1.4.58-.42 7-.42 7 .57 1.07 1 2.24 1 3.44C21 17.9 16.97 21 12 21s-9-3-9-7.56c0-1.25.5-2.4 1-3.44 0 0-1.89-6.42-.5-7 1.39-.58 4.72.23 6.5 2.23A9.04 9.04 0 0 1 12 5Z"/>
        </svg>
      } @else {
        <svg class="w-4 h-4 text-pine-700 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/>
        </svg>
      }

      <span class="text-sm font-bold tracking-tight" data-testid="patient-name">{{ name() }}</span>
      <span class="rounded-md px-1.5 py-0.5 text-[11px] font-semibold" [ngClass]="speciesConfig().tagClasses">
        {{ speciesConfig().speciesText }}
      </span>
    </div>

    @if (!compact()) {
      @if (breed()) {
        <span class="hidden sm:inline text-xs text-slate-600">• {{ breed() }}</span>
      }
      @if (ownerName()) {
        <span class="text-xs font-medium text-slate-700 border-l border-slate-300 pl-2" data-testid="patient-owner">
          Tutor: {{ ownerName() }}
        </span>
      }
    }
  </div>
}
